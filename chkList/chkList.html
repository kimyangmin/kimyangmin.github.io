<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>축제 스케줄러 OS 모니터</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            background: #f9f9f9; 
            color: #222;
            margin: 0;
        }
        h2 { 
            text-align: center; 
            font-size: 20px; 
            font-weight: 700; 
            margin: 10px 0 20px 0; 
        }
        .card { 
            background: white; 
            padding: 18px; 
            margin-bottom: 12px; 
            border: 1px solid #e0e0e0; 
            border-radius: 6px; 
        }
        h3 { 
            margin-top: 0; 
            color: #000; 
            font-size: 16px; 
            border-bottom: 1px solid #f0f0f0; 
            padding-bottom: 10px; 
            margin-bottom: 15px;
        }
        .section-title { 
            background: #e8e8e8; 
            color: #333; 
            padding: 10px; 
            border-radius: 4px; 
            text-align: center; 
            margin: 25px 0 15px 0; 
            font-size: 15px; 
            font-weight: 700; 
        }
        label { 
            display: block; 
            margin: 12px 0 6px; 
            font-weight: 600; 
            font-size: 13px; 
            color: #555; 
        }
        input[type="time"], input[type="number"], input[type="text"], select { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px;
            background-color: #fff;
        }
        .btn-group { 
            margin-top: 20px; 
            display: flex; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 4px; 
            font-weight: 600; 
            font-size: 14px;
            cursor: pointer; 
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-save { 
            background: #333; 
            color: white; 
        }
        .btn-save:active {
            background: #555;
        }
        .btn-download { 
            background: #111; 
            color: white; 
            padding: 15px; 
            font-size: 15px; 
            margin-bottom: 20px; 
        }
        .btn-reset {
            background: transparent;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            padding: 15px;
            font-size: 15px;
            margin-top: 15px;
            margin-bottom: 40px;
        }
        .btn-reset:active {
            background: #ffebee;
        }
        .checkbox-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: 5px; 
        }
        .checkbox-group label { 
            font-weight: 400; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            font-size: 14px;
            color: #222;
        }
        .checkbox-group input { 
            width: auto; 
            margin-right: 8px; 
        }
    </style>
</head>
<body>

    <h2>축제 성능 분석 시스템</h2>
    <button class="btn-download" onclick="downloadData()">데이터 다운로드 (JSON/CSV)</button>

    <div id="stage-list"></div>

    <button class="btn-reset" onclick="clearData()">데이터 초기화</button>

    <script>
        const teams = [
            { id: "1-1", name: "미라클 나인(성일고)" },
            { id: "1-2", name: "EDEN(성일정보고)" },
            { id: "1-3", name: "악마의 래핑(성일고)" },
            { id: "1-4", name: "창마과 트와이스(성일정보고)" },
            { id: "1-5", name: "오진대(성일정보고)" },
            { id: "1-6", name: "섹시킹 프미나(성일고)" },
            { id: "1-7", name: "진리 정의 애국(성일고)" },
            { id: "1-8", name: "SPR 홍보동아리(성일정보고)" },
            { id: "1-9", name: "DREAM(성일정보고)" },
            { id: "1-10", name: "야르티스(성일고)" },
            { id: "2-1", name: "ZEST(성일정보고)" },
            { id: "2-2", name: "OKASHII(성일정보고)" },
            { id: "2-3", name: "야차(성일고)" },
            { id: "2-4", name: "우리집 정수기(성일정보고)" },
            { id: "2-5", name: "잘못된 만남(성일고&성일정보고)" },
            { id: "2-6", name: "트리케라톱스(성일고)" },
            { id: "2-7", name: "스몰 뱅(성일고)" },
            { id: "2-8", name: "회계 사이에 피어난 금융(성일정보고)" },
            { id: "2-9", name: "LET ME DANCE(LMD)(성일정보고)" },
            { id: "2-10", name: "찬조팀(외부)" }
        ];

        const container = document.getElementById('stage-list');

        let currentSection = "";

        teams.forEach(team => {
            const section = team.id.startsWith("1-") ? "전반전" : "후반전";
            if (currentSection !== section) {
                const sectionTitle = document.createElement('div');
                sectionTitle.className = 'section-title';
                sectionTitle.innerText = section;
                container.appendChild(sectionTitle);
                currentSection = section;
            }

            const saved = JSON.parse(localStorage.getItem(team.id)) || {};

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${team.name}</h3>
                
                <label>시작 시각</label>
                <input type="time" id="start-${team.id}" value="${saved.startTime || ''}" oninput="handleTimeInput('${team.id}')">
                
                <label>종료 시각</label>
                <input type="time" id="end-${team.id}" value="${saved.endTime || ''}" oninput="handleTimeInput('${team.id}')">
                
                <label>대기 시간 (분)</label>
                <input type="number" id="wait-${team.id}" placeholder="자동 계산됨 (수정 가능)" value="${saved.waitTime || '0'}">
                
                <label>오버헤드 원인</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="overhead-${team.id}" value="악기셋" ${saved.overhead?.includes('악기셋') ? 'checked' : ''}> 악기셋</label>
                    <label><input type="checkbox" class="overhead-${team.id}" value="MC멘트" ${saved.overhead?.includes('MC멘트') ? 'checked' : ''}> MC멘트</label>
                    <label><input type="checkbox" class="overhead-${team.id}" value="무대정돈" ${saved.overhead?.includes('무대정돈') ? 'checked' : ''}> 무대정돈</label>
                    <label><input type="checkbox" class="overhead-${team.id}" value="기기오류" ${saved.overhead?.includes('기기오류') ? 'checked' : ''}> 기기오류</label>
                </div>
                
                <label>호위 효과 (Convoy Effect)</label>
                <select id="convoy-${team.id}">
                    <option value="" ${!saved.convoy ? 'selected' : ''}>선택안함</option>
                    <option value="No" ${saved.convoy === 'No' ? 'selected' : ''}>No</option>
                    <option value="Yes" ${saved.convoy === 'Yes' ? 'selected' : ''}>Yes</option>
                </select>
                
                <label>반응 레이턴시</label>
                <select id="latency-${team.id}">
                    <option value="" ${!saved.latency ? 'selected' : ''}>선택안함</option>
                    <option value="바로신남" ${saved.latency === '바로신남' ? 'selected' : ''}>바로신남</option>
                    <option value="1~2분뒤" ${saved.latency === '1~2분뒤' ? 'selected' : ''}>1~2분뒤</option>
                    <option value="조용함" ${saved.latency === '조용함' ? 'selected' : ''}>조용함</option>
                </select>
                
                <label>비고</label>
                <input type="text" id="memo-${team.id}" placeholder="특이사항 입력" value="${saved.memo || ''}">
                
                <div class="btn-group">
                    <button class="btn-save" onclick="saveTeam('${team.id}', '${team.name}')">저장</button>
                </div>
            `;
            container.appendChild(card);
        });

        function timeToMinutes(timeStr) {
            if (!timeStr) return null;
            const [hrs, mins] = timeStr.split(':').map(Number);
            return hrs * 60 + mins;
        }

        function handleTimeInput(id) {
            const index = teams.findIndex(t => t.id === id);
            if (index === -1) return;

            calculateWaitTime(index);
            calculateWaitTime(index + 1);
        }

        function calculateWaitTime(targetIndex) {
            if (targetIndex <= 0 || targetIndex >= teams.length) return;

            const currentTeam = teams[targetIndex];
            const prevTeam = teams[targetIndex - 1];

            const currentPart = currentTeam.id.split('-')[0];
            const prevPart = prevTeam.id.split('-')[0];
            if (currentPart !== prevPart) return;

            const prevEndStr = document.getElementById(`end-${prevTeam.id}`).value;
            const currentStartStr = document.getElementById(`start-${currentTeam.id}`).value;

            if (prevEndStr && currentStartStr) {
                const prevMins = timeToMinutes(prevEndStr);
                const currentMins = timeToMinutes(currentStartStr);

                if (prevMins !== null && currentMins !== null) {
                    const diff = currentMins - prevMins;
                    document.getElementById(`wait-${currentTeam.id}`).value = diff;
                }
            }
        }

        function saveTeam(id, name) {
            const overheadCheckboxes = document.querySelectorAll(`.overhead-${id}:checked`);
            const overhead = Array.from(overheadCheckboxes).map(cb => cb.value);

            const data = {
                teamName: name,
                startTime: document.getElementById(`start-${id}`).value,
                endTime: document.getElementById(`end-${id}`).value,
                waitTime: document.getElementById(`wait-${id}`).value,
                overhead: overhead,
                convoy: document.getElementById(`convoy-${id}`).value,
                latency: document.getElementById(`latency-${id}`).value,
                memo: document.getElementById(`memo-${id}`).value
            };

            localStorage.setItem(id, JSON.stringify(data));

            const saveBtn = document.querySelector(`#start-${id}`).parentElement.querySelector('.btn-save');
            const originalText = saveBtn.innerText;
            saveBtn.innerText = "저장 완료!";
            saveBtn.style.backgroundColor = "#4caf50";
            saveBtn.style.color = "white";

            setTimeout(() => {
                saveBtn.innerText = originalText;
                saveBtn.style.backgroundColor = "";
                saveBtn.style.color = "";
            }, 1500);
        }

        function downloadData() {
            const allData = [];
            teams.forEach(team => {
                const saved = localStorage.getItem(team.id);
                if (saved) {
                    allData.push(JSON.parse(saved));
                }
            });

            if (allData.length === 0) {
                alert("저장된 데이터가 없습니다.");
                return;
            }

            const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData, null, 2));
            const jsonAnchor = document.createElement('a');
            jsonAnchor.setAttribute("href", jsonString);
            jsonAnchor.setAttribute("download", "festival_os_data.json");
            document.body.appendChild(jsonAnchor);
            jsonAnchor.click();
            jsonAnchor.remove();

            let csvContent = "\uFEFF";
            csvContent += "팀이름,시작시간,종료시간,대기시간(분),오버헤드원인,호위효과,레이턴시,비고\n";

            allData.forEach(row => {
                const overheadStr = row.overhead.join("|");
                const memoStr = row.memo ? row.memo.replace(/"/g, '""') : "";
                csvContent += `"${row.teamName}","${row.startTime}","${row.endTime}","${row.waitTime}","${overheadStr}","${row.convoy}","${row.latency}","${memoStr}"\n`;
            });

            const csvString = "data:text/csv;charset=utf-8," + encodeURIComponent(csvContent);
            const csvAnchor = document.createElement('a');
            csvAnchor.setAttribute("href", csvString);
            csvAnchor.setAttribute("download", "festival_os_data.csv");
            document.body.appendChild(csvAnchor);
            csvAnchor.click();
            csvAnchor.remove();
        }

        function clearData() {
            if (confirm("정말 모든 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.")) {
                teams.forEach(team => {
                    localStorage.removeItem(team.id);
                });
                alert("데이터가 완전히 초기화되었습니다.");
                location.reload();
            }
        }
    </script>
</body>
</html>
